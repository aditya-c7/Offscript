# Offscript deployment: web + worker, terminated at Cloudflare.
# Public origin: https://offscript.adityahq.me
#
# Postgres is EXTERNAL. Its connection string and every provider key come from
# the environment (or an untracked env file passed with `docker compose --env-file`);
# nothing secret is stored in this file. No hardcoded IPs or internal addresses.

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: offscript-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the external Postgres instance}
      STORAGE_DIR: /app/storage
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://offscript.adityahq.me}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - offscript-storage:/app/storage

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: offscript-worker:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the external Postgres instance}
      STORAGE_DIR: /app/storage
      WORKER_MEMORY_MB: ${WORKER_MEMORY_MB:-4096}
      LLM_PROVIDER: ${LLM_PROVIDER:-nvidia}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-groq}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-meta/llama-3.3-70b-instruct,openai/gpt-oss-20b}
      LLM_MODEL_AGENT: ${LLM_MODEL_AGENT:-openai/gpt-oss-120b,qwen/qwen3-235b-a22b}
      LLM_MODEL_VISION: ${LLM_MODEL_VISION:-meta/llama-3.2-90b-vision-instruct,mistralai/mistral-large-3-675b-instruct-2512}
      LLM_FALLBACK_MODEL_FAST: ${LLM_FALLBACK_MODEL_FAST:-llama-3.3-70b-versatile}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Shared with web so artifact routes can serve what the worker records.
    volumes:
      - offscript-storage:/app/storage
    shm_size: "2gb"

volumes:
  offscript-storage:
