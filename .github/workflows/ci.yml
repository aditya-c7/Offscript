name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @offscript/e2e exec playwright install chromium --with-deps
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check web deploy config for legacy container/proxy paths
        run: node scripts/check-web-deploy-config.mjs
      - name: Negative test for deploy-config guard
        run: node scripts/check-web-deploy-config.test.mjs
      - name: Validate required runtime config names (values not printed)
        env:
          DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
          DB_DRIVER: neon-http
          WORKER_ENQUEUE_URL: http://127.0.0.1:8787/enqueue
          OPENROUTER_API_KEY: DUMMY
        run: node scripts/check-runtime-config.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build web with production OpenNext command
        env:
          DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @offscript/web exec opennextjs-cloudflare build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, build-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy web to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DB_DRIVER: neon-http
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm run deploy
